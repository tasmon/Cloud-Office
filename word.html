<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloud Word</title>
<meta name="theme-color" content="#3457d5" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-word.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-word-192.png" />
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="word.css" />
</head>
<body>

<div class="app" id="app" style="--accent:var(--word); --accent-tint:var(--word-tint);">

  <header class="appbar">
    <div class="appbar-left">
      <a class="hub-link" href="index.html" title="Cloud Office home"><span class="mark">C</span></a>
      <span class="app-name">Cloud Word</span>
      <input id="docTitle" class="doc-title" value="Untitled document" spellcheck="false" aria-label="Document title" />
    </div>
    <div class="appbar-right">
      <span class="save-status" id="saveStatus">Saved</span>
      <button class="icon-btn" id="btnSettings" title="Settings">⚙</button>
      <button class="icon-btn" id="btnHelp" title="Help">?</button>
    </div>
  </header>

  <nav class="menubar" id="menubar">
    <div class="menubar-item">File
      <div class="menubar-dropdown">
        <button id="mNew">New document<span class="shortcut"></span></button>
        <label class="file-btn" style="display:flex;width:100%;">
          <button style="width:100%;text-align:left;" type="button" id="mOpenTrigger">Open from computer</button>
          <input type="file" id="fileOpen" accept=".docx,.txt,.html" hidden />
        </label>
        <hr class="menu-sep" />
        <div class="menu-label">Download</div>
        <button id="mExportDocx">Word document (.docx)</button>
        <button id="mExportHtml">Web page (.html)</button>
        <button id="mExportTxt">Plain text (.txt)</button>
        <hr class="menu-sep" />
        <button id="mPrint">Print<span class="shortcut">Ctrl+P</span></button>
        <button id="mDelete">Delete this document</button>
        <hr class="menu-sep" />
        <button id="mClose">Close, back to Cloud Office</button>
      </div>
    </div>
    <div class="menubar-item">Edit
      <div class="menubar-dropdown">
        <button id="mUndo">Undo<span class="shortcut">Ctrl+Z</span></button>
        <button id="mRedo">Redo<span class="shortcut">Ctrl+Y</span></button>
        <hr class="menu-sep" />
        <button id="mFind">Find and replace<span class="shortcut">Ctrl+F</span></button>
        <button id="mSelectAll">Select all<span class="shortcut">Ctrl+A</span></button>
      </div>
    </div>
    <div class="menubar-item">Insert
      <div class="menubar-dropdown">
        <button id="mInsertImage">Image</button>
        <button id="mInsertTable">Table</button>
        <button id="mInsertLink">Link</button>
        <button id="mInsertLine">Horizontal line</button>
        <button id="mInsertBreak">Page break</button>
      </div>
    </div>
    <div class="menubar-item">Format
      <div class="menubar-dropdown">
        <button id="mBold">Bold<span class="shortcut">Ctrl+B</span></button>
        <button id="mItalic">Italic<span class="shortcut">Ctrl+I</span></button>
        <button id="mUnderline">Underline<span class="shortcut">Ctrl+U</span></button>
        <hr class="menu-sep" />
        <div class="menu-label">Line spacing</div>
        <button id="mLs1">Single</button>
        <button id="mLs115">1.15</button>
        <button id="mLs15">1.5</button>
        <button id="mLs2">Double</button>
        <hr class="menu-sep" />
        <button id="mClearFormat">Clear formatting</button>
      </div>
    </div>
    <div class="menubar-item">Table
      <div class="menubar-dropdown">
        <button id="mRowBelow">Insert row below</button>
        <button id="mRowDel">Delete row</button>
        <button id="mColRight">Insert column right</button>
        <button id="mColDel">Delete column</button>
      </div>
    </div>
    <div class="menubar-item">View
      <div class="menubar-dropdown">
        <button id="mToggleSidebar">Show/hide document list</button>
        <div class="menu-label">Zoom</div>
        <button data-zoom="0.75">75%</button>
        <button data-zoom="1" class="checked">100%</button>
        <button data-zoom="1.25">125%</button>
        <button data-zoom="1.5">150%</button>
      </div>
    </div>
    <div class="menubar-item">Help
      <div class="menubar-dropdown">
        <button id="mHelpCenter">Help center</button>
        <button id="mAbout">About Cloud Word</button>
      </div>
    </div>
  </nav>

  <div class="toolbar" id="toolbar">
    <div class="tgroup">
      <button class="tbtn" data-cmd="undo" title="Undo (Ctrl+Z)">↶</button>
      <button class="tbtn" data-cmd="redo" title="Redo (Ctrl+Y)">↷</button>
      <button class="tbtn" id="btnFind" title="Find and replace (Ctrl+F)">🔎</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <select id="blockFormat" title="Paragraph style">
        <option value="p">Paragraph</option>
        <option value="h1">Heading 1</option>
        <option value="h2">Heading 2</option>
        <option value="h3">Heading 3</option>
        <option value="blockquote">Quote</option>
        <option value="pre">Code</option>
      </select>
      <select id="fontFamily" title="Font"></select>
      <select id="fontSize" title="Font size">
        <option>8</option><option>9</option><option>10</option><option>11</option><option selected>12</option>
        <option>14</option><option>16</option><option>18</option><option>20</option><option>24</option>
        <option>28</option><option>30</option><option>36</option><option>48</option><option>60</option><option>72</option><option>96</option>
      </select>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button class="tbtn" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button class="tbtn" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
      <button class="tbtn" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
      <button class="tbtn" data-cmd="superscript" title="Superscript">x²</button>
      <button class="tbtn" data-cmd="subscript" title="Subscript">x₂</button>
      <label class="tbtn color-btn" title="Text color">A<input type="color" id="textColor" value="#14161f" /></label>
      <label class="tbtn color-btn" title="Highlight color">▧<input type="color" id="hiliteColor" value="#fff3a0" /></label>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <select id="lineSpacing" title="Line spacing">
        <option value="1">Single</option>
        <option value="1.15">1.15</option>
        <option value="1.5">1.5</option>
        <option value="2">Double</option>
      </select>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn" data-cmd="justifyLeft" title="Align left">⯇</button>
      <button class="tbtn" data-cmd="justifyCenter" title="Align center">☰</button>
      <button class="tbtn" data-cmd="justifyRight" title="Align right">⯈</button>
      <button class="tbtn" data-cmd="justifyFull" title="Justify">▤</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn" data-cmd="insertUnorderedList" title="Bullet list">• ≡</button>
      <button class="tbtn" data-cmd="insertOrderedList" title="Numbered list">1. ≡</button>
      <button class="tbtn" data-cmd="outdent" title="Decrease indent">⇤</button>
      <button class="tbtn" data-cmd="indent" title="Increase indent">⇥</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn" id="btnLink" title="Insert link">🔗</button>
      <button class="tbtn" id="btnImage" title="Insert image">🖼</button>
      <button class="tbtn" id="btnTable" title="Insert table">▦</button>
      <button class="tbtn" data-cmd="insertHorizontalRule" title="Horizontal line">―</button>
      <button class="tbtn" id="btnPageBreak" title="Insert page break">⤓ Page</button>
      <button class="tbtn" data-cmd="removeFormat" title="Clear formatting">⨯</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup" id="tableTools">
      <button class="tbtn wide" id="btnRowBelow" title="Insert row below">+Row</button>
      <button class="tbtn wide" id="btnRowDel" title="Delete row">−Row</button>
      <button class="tbtn wide" id="btnColRight" title="Insert column right">+Col</button>
      <button class="tbtn wide" id="btnColDel" title="Delete column">−Col</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn" id="btnPrint" title="Print">🖨</button>
      <select id="zoomSelect" title="Zoom">
        <option value="0.75">75%</option>
        <option value="0.9">90%</option>
        <option value="1" selected>100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
      </select>
      <div class="menu-wrap">
        <button class="btn primary small" id="btnExportMenu">Download ▾</button>
        <div class="menu" id="exportMenu">
          <button data-export="docx">Word document (.docx)</button>
          <button data-export="html">Web page (.html)</button>
          <button data-export="txt">Plain text (.txt)</button>
        </div>
      </div>
    </div>
    <input type="file" id="imageInput" accept="image/*" hidden />
  </div>

  <div class="find-bar" id="findBar" hidden>
    <input id="findInput" placeholder="Find" autocomplete="off" />
    <input id="replaceInput" placeholder="Replace with" autocomplete="off" />
    <button class="btn ghost small" id="btnFindNext">Next</button>
    <button class="btn ghost small" id="btnReplace">Replace</button>
    <button class="btn ghost small" id="btnReplaceAll">Replace all</button>
    <span class="find-count" id="findCount"></span>
    <button class="icon-btn" id="btnFindClose" title="Close">✕</button>
  </div>

  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <button class="new-doc-btn" id="btnNewDoc">New document</button>
      <div class="sidebar-label">Your documents</div>
      <div class="doc-list" id="docList"></div>
    </aside>

    <main class="canvas">
      <div class="page" id="page" contenteditable="true" spellcheck="true">
        <p>Start writing</p>
      </div>
    </main>
  </div>

  <footer class="statusbar">
    <span id="wordCount">0 words</span>
    <span class="sep">|</span>
    <span id="charCount">0 characters</span>
    <span class="sep">|</span>
    <span>Saved in this browser only</span>
  </footer>
</div>

<div class="modal-backdrop" id="settingsModal" hidden>
  <div class="modal-box">
    <div class="modal-head"><h2>Settings</h2><button class="icon-btn" onclick="CloudCommon.closeModal('settingsModal')">✕</button></div>
    <div class="modal-body">
      <div class="setting-row">
        <div><div class="label">Theme</div><div class="desc">Applies across Word, Sheet and PowerPoint.</div></div>
        <div class="theme-choices">
          <button data-theme-choice="light">Light</button>
          <button data-theme-choice="dark">Dark</button>
          <button data-theme-choice="system">System</button>
        </div>
      </div>
      <div class="setting-row">
        <div><div class="label">Storage</div><div class="desc">Documents are saved in this browser only.</div></div>
      </div>
    </div>
  </div>
</div>

<script src="mammoth.browser.min.js"></script>
<script src="html-docx.js"></script>
<script src="db.js"></script>
<script src="common.js"></script>
<script src="word.js"></script>
</body>
</html>
