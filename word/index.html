<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloud Word</title>
<meta name="theme-color" content="#3457d5" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="../icons/word.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="../icons/word-192.png" />
<link rel="stylesheet" href="../shared/theme.css" />
<link rel="stylesheet" href="word.css" />
</head>
<body>

<div class="app" id="app">

  <!-- ===== Top bar ===== -->
  <header class="appbar">
    <div class="appbar-left">
      <a class="hub-link" href="../index.html" title="Back to Cloud Office" aria-label="Back to Cloud Office">
        <span class="mark">C</span>
      </a>
      <button class="icon-btn" id="toggleSidebar" title="Documents" aria-label="Toggle documents panel">☰</button>
      <input id="docTitle" class="doc-title" value="Untitled document" spellcheck="false" aria-label="Document title" />
    </div>
    <div class="appbar-right">
      <span class="save-status" id="saveStatus">Saved</span>
      <button class="btn ghost" id="btnPrint">Print / PDF</button>
      <div class="menu-wrap">
        <button class="btn primary" id="btnExportMenu">Export ▾</button>
        <div class="menu" id="exportMenu">
          <button data-export="docx">Word document (.docx)</button>
          <button data-export="html">Web page (.html)</button>
          <button data-export="txt">Plain text (.txt)</button>
        </div>
      </div>
      <label class="btn ghost file-btn">
        Open
        <input type="file" id="fileOpen" accept=".docx,.txt,.html" hidden />
      </label>
    </div>
  </header>

  <!-- ===== Toolbar ===== -->
  <div class="toolbar" id="toolbar">
    <div class="tgroup">
      <button class="tbtn" data-cmd="undo" title="Undo (Ctrl+Z)">↶</button>
      <button class="tbtn" data-cmd="redo" title="Redo (Ctrl+Y)">↷</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <select id="blockFormat" title="Paragraph style">
        <option value="p">Paragraph</option>
        <option value="h1">Heading 1</option>
        <option value="h2">Heading 2</option>
        <option value="h3">Heading 3</option>
        <option value="blockquote">Quote</option>
        <option value="pre">Code</option>
      </select>
      <select id="fontFamily" title="Font">
        <option value="'Georgia', serif">Georgia</option>
        <option value="Arial, sans-serif" selected>Arial</option>
        <option value="'Times New Roman', serif">Times New Roman</option>
        <option value="'Courier New', monospace">Courier New</option>
        <option value="Verdana, sans-serif">Verdana</option>
        <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
      </select>
      <select id="fontSize" title="Font size">
        <option>10</option><option>11</option><option selected>12</option>
        <option>14</option><option>16</option><option>18</option>
        <option>24</option><option>30</option><option>36</option><option>48</option>
      </select>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button class="tbtn" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button class="tbtn" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
      <button class="tbtn" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
      <label class="tbtn color-btn" title="Text color">A<input type="color" id="textColor" value="#14161f" /></label>
      <label class="tbtn color-btn" title="Highlight color">▧<input type="color" id="hiliteColor" value="#fff3a0" /></label>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn" data-cmd="justifyLeft" title="Align left">⯇</button>
      <button class="tbtn" data-cmd="justifyCenter" title="Align center">☰</button>
      <button class="tbtn" data-cmd="justifyRight" title="Align right">⯈</button>
      <button class="tbtn" data-cmd="justifyFull" title="Justify">▤</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn" data-cmd="insertUnorderedList" title="Bullet list">• ≡</button>
      <button class="tbtn" data-cmd="insertOrderedList" title="Numbered list">1. ≡</button>
      <button class="tbtn" data-cmd="outdent" title="Decrease indent">⇤</button>
      <button class="tbtn" data-cmd="indent" title="Increase indent">⇥</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn" id="btnLink" title="Insert link">🔗</button>
      <button class="tbtn" id="btnImage" title="Insert image">🖼</button>
      <button class="tbtn" id="btnTable" title="Insert table">▦</button>
      <button class="tbtn" data-cmd="insertHorizontalRule" title="Horizontal line">―</button>
      <button class="tbtn" data-cmd="removeFormat" title="Clear formatting">⨯</button>
    </div>
    <input type="file" id="imageInput" accept="image/*" hidden />
  </div>

  <div class="workspace">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" id="sidebar">
      <button class="new-doc-btn" id="btnNewDoc">+ New document</button>
      <div class="doc-list" id="docList"></div>
    </aside>

    <!-- ===== Page canvas ===== -->
    <main class="canvas">
      <div class="page" id="page" contenteditable="true" spellcheck="true">
        <p>Start writing…</p>
      </div>
    </main>
  </div>

  <footer class="statusbar">
    <span id="wordCount">0 words</span>
    <span class="sep">·</span>
    <span id="charCount">0 characters</span>
    <span class="sep">·</span>
    <span>Stored only in this browser</span>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/mammoth@1.7.2/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
<script src="../shared/db.js"></script>
<script src="word.js"></script>
</body>
</html>
