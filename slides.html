<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloud PowerPoint</title>
<meta name="theme-color" content="#d65d3a" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-slides.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-slides-192.png" />
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="slides.css" />
</head>
<body>

<div class="app" id="app" style="--accent:var(--slides); --accent-tint:var(--slides-tint);">

  <header class="appbar">
    <div class="appbar-left">
      <a class="hub-link" href="index.html" title="Cloud Office home"><span class="mark">C</span></a>
      <button class="icon-btn" id="toggleDeckSidebar" title="Presentations">☰</button>
      <span class="app-name">Cloud PowerPoint</span>
      <input id="deckTitle" class="doc-title" value="Untitled presentation" spellcheck="false" aria-label="Presentation title" />
    </div>
    <div class="appbar-right">
      <span class="save-status" id="saveStatus">Saved</span>
      <button class="icon-btn" id="btnSettings" title="Settings">⚙</button>
      <button class="icon-btn" id="btnHelp" title="Help">?</button>
    </div>
  </header>

  <nav class="menubar" id="menubar">
    <div class="menubar-item">File
      <div class="menubar-dropdown">
        <button id="mNew">New presentation</button>
        <hr class="menu-sep" />
        <button id="mExportPptx">Download as .pptx</button>
        <button id="mExportPdf">Print / PDF</button>
        <hr class="menu-sep" />
        <button id="mPrint">Print<span class="shortcut">Ctrl+P</span></button>
        <button id="mDelete">Delete this presentation</button>
        <hr class="menu-sep" />
        <button id="mClose">Close, back to Cloud Office</button>
      </div>
    </div>
    <div class="menubar-item">Edit
      <div class="menubar-dropdown">
        <button id="mUndo">Undo<span class="shortcut">Ctrl+Z</span></button>
        <button id="mRedo">Redo<span class="shortcut">Ctrl+Y</span></button>
        <hr class="menu-sep" />
        <button id="mDeleteEl">Delete selected</button>
      </div>
    </div>
    <div class="menubar-item">Insert
      <div class="menubar-dropdown">
        <button id="mAddText">Text box</button>
        <button id="mAddRect">Rectangle</button>
        <button id="mAddEllipse">Ellipse</button>
        <button id="mAddLine">Line</button>
        <button id="mAddArrow">Arrow</button>
        <button id="mAddImage">Image</button>
        <hr class="menu-sep" />
        <button id="mAddSlideBlank">New slide, blank</button>
        <button id="mAddSlideTitle">New slide, title</button>
        <button id="mAddSlideContent">New slide, title and content</button>
      </div>
    </div>
    <div class="menubar-item">Format
      <div class="menubar-dropdown">
        <button id="mBold">Bold</button>
        <button id="mItalic">Italic</button>
        <hr class="menu-sep" />
        <button id="mToFront">Bring to front</button>
        <button id="mToBack">Send to back</button>
        <hr class="menu-sep" />
        <div class="menu-label">Align</div>
        <button data-align-obj="left">Left</button>
        <button data-align-obj="hcenter">Center</button>
        <button data-align-obj="right">Right</button>
        <button data-align-obj="top">Top</button>
        <button data-align-obj="vcenter">Middle</button>
        <button data-align-obj="bottom">Bottom</button>
      </div>
    </div>
    <div class="menubar-item">Slide
      <div class="menubar-dropdown">
        <button id="mDuplicateSlide">Duplicate slide</button>
        <button id="mDeleteSlide">Delete slide</button>
        <hr class="menu-sep" />
        <button id="mNotesToggle">Show/hide speaker notes</button>
      </div>
    </div>
    <div class="menubar-item">View
      <div class="menubar-dropdown">
        <button id="mPresent">Present<span class="shortcut">F5</span></button>
        <button id="mToggleDeckSidebar">Show/hide presentation list</button>
      </div>
    </div>
    <div class="menubar-item">Help
      <div class="menubar-dropdown">
        <button id="mHelpCenter">Help center</button>
        <button id="mAbout">About Cloud PowerPoint</button>
      </div>
    </div>
  </nav>

  <div class="toolbar" id="toolbar">
    <div class="tgroup">
      <button class="tbtn" id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
      <button class="tbtn" id="btnRedo" title="Redo (Ctrl+Y)">↷</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn wide" id="btnAddText">+ Text</button>
      <button class="tbtn" id="btnAddRect" title="Rectangle">▭</button>
      <button class="tbtn" id="btnAddEllipse" title="Ellipse">◯</button>
      <button class="tbtn" id="btnAddLine" title="Line">╱</button>
      <button class="tbtn" id="btnAddArrow" title="Arrow">↗</button>
      <button class="tbtn" id="btnAddImage" title="Insert image">🖼</button>
      <input type="file" id="imageInput" accept="image/*" hidden />
    </div>
    <span class="tsep"></span>
    <div class="tgroup" id="textTools">
      <select id="fontFamily" title="Font"></select>
      <select id="fontSize" title="Font size">
        <option>12</option><option>14</option><option>18</option><option selected>24</option>
        <option>32</option><option>40</option><option>54</option><option>72</option>
      </select>
      <button class="tbtn" id="tBold" title="Bold"><b>B</b></button>
      <button class="tbtn" id="tItalic" title="Italic"><i>I</i></button>
      <button class="tbtn" data-align="left" title="Align left">⯇</button>
      <button class="tbtn" data-align="center" title="Align center">☰</button>
      <button class="tbtn" data-align="right" title="Align right">⯈</button>
      <label class="tbtn color-btn" title="Text color">A<input type="color" id="textColor" value="#14161f" /></label>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <label class="tbtn color-btn" title="Fill / line color">▧<input type="color" id="fillColor" value="#d65d3a" /></label>
      <label class="tbtn color-btn" title="Slide background">▤<input type="color" id="bgColor" value="#ffffff" /></label>
      <button class="tbtn" id="btnDeleteEl" title="Delete selected">🗑</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn wide" id="btnToFront" title="Bring to front">Front</button>
      <button class="tbtn wide" id="btnToBack" title="Send to back">Back</button>
      <button class="tbtn wide" id="btnDuplicateSlide" title="Duplicate slide">Duplicate</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup" id="alignTools">
      <button class="tbtn" data-align-obj="left" title="Align left">⯇|</button>
      <button class="tbtn" data-align-obj="hcenter" title="Align center">|☰|</button>
      <button class="tbtn" data-align-obj="right" title="Align right">|⯈</button>
      <button class="tbtn" data-align-obj="top" title="Align top">⤒</button>
      <button class="tbtn" data-align-obj="vcenter" title="Align middle">☰</button>
      <button class="tbtn" data-align-obj="bottom" title="Align bottom">⤓</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn wide" id="btnNotesToggle" title="Speaker notes">Notes</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="btn ghost small" id="btnPresent">Present</button>
      <div class="menu-wrap">
        <button class="btn primary small" id="btnExportMenu">Download ▾</button>
        <div class="menu" id="exportMenu">
          <button data-export="pptx">PowerPoint (.pptx)</button>
          <button data-export="pdf">Print / PDF</button>
        </div>
      </div>
    </div>
  </div>

  <div class="workspace">
    <aside class="sidebar" id="deckSidebar">
      <button class="new-doc-btn" id="btnNewDeck">New presentation</button>
      <div class="sidebar-label">Your presentations</div>
      <div class="doc-list" id="deckList"></div>
    </aside>

    <aside class="slide-panel" id="slidePanel">
      <div class="slide-list" id="slideList"></div>
      <div class="panel-actions">
        <button class="btn ghost small" id="btnAddSlideBlank">+ Blank</button>
        <button class="btn ghost small" id="btnAddSlideTitle">+ Title</button>
        <button class="btn ghost small" id="btnAddSlideContent">+ Title and content</button>
      </div>
    </aside>

    <main class="canvas-wrap">
      <div class="slide-stage" id="slideStage">
        <div class="slide" id="slide"></div>
      </div>
      <div class="notes-panel" id="notesPanel" hidden>
        <label for="notesInput">Speaker notes</label>
        <textarea id="notesInput" placeholder="Notes for this slide, not shown to the audience"></textarea>
      </div>
    </main>
  </div>

  <footer class="statusbar">
    <span id="slideCountLabel">1 / 1</span>
    <span class="sep">|</span>
    <span>Saved in this browser only</span>
  </footer>
</div>

<div class="present-overlay" id="presentOverlay">
  <div class="present-slide" id="presentSlide"></div>
  <button class="present-exit" id="btnExitPresent">Esc, exit</button>
  <div class="present-nav">
    <button id="presPrev">‹</button>
    <span id="presCounter">1 / 1</span>
    <button id="presNext">›</button>
  </div>
</div>

<div class="modal-backdrop" id="settingsModal" hidden>
  <div class="modal-box">
    <div class="modal-head"><h2>Settings</h2><button class="icon-btn" onclick="CloudCommon.closeModal('settingsModal')">✕</button></div>
    <div class="modal-body">
      <div class="setting-row">
        <div><div class="label">Theme</div><div class="desc">Applies across Word, Sheet and PowerPoint.</div></div>
        <div class="theme-choices">
          <button data-theme-choice="light">Light</button>
          <button data-theme-choice="dark">Dark</button>
          <button data-theme-choice="system">System</button>
        </div>
      </div>
      <div class="setting-row">
        <div><div class="label">Storage</div><div class="desc">Presentations are saved in this browser only.</div></div>
      </div>
    </div>
  </div>
</div>

<script src="pptxgen.bundle.js"></script>
<script src="db.js"></script>
<script src="undo.js"></script>
<script src="common.js"></script>
<script src="slides.js"></script>
</body>
</html>
