<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloud Sheet</title>
<meta name="theme-color" content="#1e8e5a" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-sheet.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-sheet-192.png" />
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="sheet.css" />
</head>
<body>

<div class="app" id="app" style="--accent:var(--sheet); --accent-tint:var(--sheet-tint);">

  <header class="appbar">
    <div class="appbar-left">
      <a class="hub-link" href="index.html" title="Cloud Office home"><span class="mark">C</span></a>
      <button class="icon-btn" id="toggleSidebar" title="Workbooks">☰</button>
      <span class="app-name">Cloud Sheet</span>
      <input id="bookTitle" class="doc-title" value="Untitled workbook" spellcheck="false" aria-label="Workbook title" />
    </div>
    <div class="appbar-right">
      <span class="save-status" id="saveStatus">Saved</span>
      <button class="icon-btn" id="btnSettings" title="Settings">⚙</button>
      <button class="icon-btn" id="btnHelp" title="Help">?</button>
    </div>
  </header>

  <nav class="menubar" id="menubar">
    <div class="menubar-item">File
      <div class="menubar-dropdown">
        <button id="mNew">New workbook</button>
        <button id="mOpenTrigger">Open from computer</button>
        <input type="file" id="fileOpen" accept=".xlsx,.xls,.csv" hidden />
        <hr class="menu-sep" />
        <div class="menu-label">Download</div>
        <button id="mExportXlsx">Excel workbook (.xlsx)</button>
        <button id="mExportCsv">Current sheet (.csv)</button>
        <hr class="menu-sep" />
        <button id="mPrint">Print<span class="shortcut">Ctrl+P</span></button>
        <button id="mDelete">Delete this workbook</button>
        <hr class="menu-sep" />
        <button id="mClose">Close, back to Cloud Office</button>
      </div>
    </div>
    <div class="menubar-item">Edit
      <div class="menubar-dropdown">
        <button id="mUndo">Undo<span class="shortcut">Ctrl+Z</span></button>
        <button id="mRedo">Redo<span class="shortcut">Ctrl+Y</span></button>
        <hr class="menu-sep" />
        <button id="mCopy">Copy<span class="shortcut">Ctrl+C</span></button>
        <button id="mCut">Cut<span class="shortcut">Ctrl+X</span></button>
        <button id="mPaste">Paste<span class="shortcut">Ctrl+V</span></button>
        <button id="mDeleteRange">Delete selected cells</button>
        <hr class="menu-sep" />
        <button id="mFind">Find and replace<span class="shortcut">Ctrl+F</span></button>
      </div>
    </div>
    <div class="menubar-item">Insert
      <div class="menubar-dropdown">
        <button id="mInsertRow">Row below</button>
        <button id="mInsertCol">Column right</button>
        <button id="mInsertChart">Chart</button>
        <button id="mInsertSheet">New sheet</button>
      </div>
    </div>
    <div class="menubar-item">Format
      <div class="menubar-dropdown">
        <button id="mBold">Bold</button>
        <button id="mItalic">Italic</button>
        <button id="mUnderline">Underline</button>
        <hr class="menu-sep" />
        <div class="menu-label">Number format</div>
        <button data-fmt="general">General</button>
        <button data-fmt="number">Number</button>
        <button data-fmt="currency">Currency</button>
        <button data-fmt="percent">Percent</button>
        <button data-fmt="date">Date</button>
        <hr class="menu-sep" />
        <button id="mMerge">Merge cells</button>
        <button id="mFreeze">Freeze header row and column</button>
      </div>
    </div>
    <div class="menubar-item">Data
      <div class="menubar-dropdown">
        <button id="mSortAsc">Sort sheet by column, A to Z</button>
        <button id="mSortDesc">Sort sheet by column, Z to A</button>
        <hr class="menu-sep" />
        <button id="mDeleteRow">Delete row</button>
        <button id="mDeleteCol">Delete column</button>
      </div>
    </div>
    <div class="menubar-item">View
      <div class="menubar-dropdown">
        <button id="mToggleSidebar">Show/hide workbook list</button>
      </div>
    </div>
    <div class="menubar-item">Help
      <div class="menubar-dropdown">
        <button id="mHelpCenter">Help center</button>
        <button id="mAbout">About Cloud Sheet</button>
      </div>
    </div>
  </nav>

  <div class="toolbar" id="toolbar">
    <div class="tgroup">
      <button class="tbtn" id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
      <button class="tbtn" id="btnRedo" title="Redo (Ctrl+Y)">↷</button>
      <button class="tbtn" id="btnFind" title="Find and replace (Ctrl+F)">🔎</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <select id="fontFamily" title="Font"></select>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn" data-cmd="bold" title="Bold"><b>B</b></button>
      <button class="tbtn" data-cmd="italic" title="Italic"><i>I</i></button>
      <button class="tbtn" data-cmd="underline" title="Underline"><u>U</u></button>
      <label class="tbtn color-btn" title="Text color">A<input type="color" id="textColor" value="#14161f" /></label>
      <label class="tbtn color-btn" title="Fill color">▧<input type="color" id="fillColor" value="#ffffff" /></label>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn" data-align="left" title="Align left">⯇</button>
      <button class="tbtn" data-align="center" title="Align center">☰</button>
      <button class="tbtn" data-align="right" title="Align right">⯈</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <select id="numFormat" title="Number format">
        <option value="general">General</option>
        <option value="number">Number (1,234.50)</option>
        <option value="integer">Integer (1,234)</option>
        <option value="currency">Currency ($1,234.50)</option>
        <option value="percent">Percent (12.3%)</option>
        <option value="date">Date</option>
      </select>
      <button class="tbtn wide" id="btnBorder" title="Toggle cell borders">▦ Border</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn wide" id="btnInsertRow" title="Insert row below">+Row</button>
      <button class="tbtn wide" id="btnDeleteRow" title="Delete selected row">−Row</button>
      <button class="tbtn wide" id="btnInsertCol" title="Insert column right">+Col</button>
      <button class="tbtn wide" id="btnDeleteCol" title="Delete selected column">−Col</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn wide" id="btnSortAsc" title="Sort selected column A to Z">Sort ▲</button>
      <button class="tbtn wide" id="btnSortDesc" title="Sort selected column Z to A">Sort ▼</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn wide" id="btnMerge" title="Merge selected cells">Merge</button>
      <button class="tbtn wide" id="btnFreeze" title="Freeze header row and column">❄ Freeze</button>
      <button class="tbtn wide" id="btnChart" title="Insert chart from selected range">📊 Chart</button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tbtn" id="btnPrint" title="Print">🖨</button>
      <div class="menu-wrap">
        <button class="btn primary small" id="btnExportMenu">Download ▾</button>
        <div class="menu" id="exportMenu">
          <button data-export="xlsx">Excel workbook (.xlsx)</button>
          <button data-export="csv">Current sheet (.csv)</button>
        </div>
      </div>
    </div>
  </div>

  <div class="find-bar" id="findBar" hidden>
    <input id="findInput" placeholder="Find" autocomplete="off" />
    <input id="replaceInput" placeholder="Replace with" autocomplete="off" />
    <button class="btn ghost small" id="btnFindNext">Next</button>
    <button class="btn ghost small" id="btnReplace">Replace</button>
    <button class="btn ghost small" id="btnReplaceAll">Replace all</button>
    <span class="find-count" id="findCount"></span>
    <button class="icon-btn" id="btnFindClose" title="Close">✕</button>
  </div>

  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <button class="new-doc-btn" id="btnNewBook">New workbook</button>
      <div class="sidebar-label">Your workbooks</div>
      <div class="doc-list" id="bookList"></div>
    </aside>

    <div class="sheet-main">
      <div class="formula-bar">
        <span class="cell-ref" id="cellRef">A1</span>
        <span class="fx">fx</span>
        <input id="formulaInput" autocomplete="off" spellcheck="false" placeholder="Enter a value or formula, e.g. =SUM(A1:A5)" />
      </div>

      <div class="grid-wrap" id="gridWrap">
        <table class="grid" id="grid"></table>
      </div>

      <footer class="tabs-bar">
        <div class="tabs" id="tabs"></div>
        <button class="tab-add" id="btnAddSheet" title="Add sheet">+</button>
        <div class="spacer"></div>
        <span class="hint">Saved in this browser only</span>
      </footer>
    </div>
  </div>

  <div class="chart-modal" id="chartModal" hidden>
    <div class="chart-panel">
      <div class="chart-head">
        <strong>Chart</strong>
        <div class="chart-type-switch">
          <button class="tbtn wide active" data-chart-type="bar">Bar</button>
          <button class="tbtn wide" data-chart-type="line">Line</button>
          <button class="tbtn wide" data-chart-type="pie">Pie</button>
        </div>
        <button class="icon-btn" id="btnChartClose" title="Close">✕</button>
      </div>
      <div id="chartSvgWrap"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="settingsModal" hidden>
  <div class="modal-box">
    <div class="modal-head"><h2>Settings</h2><button class="icon-btn" onclick="CloudCommon.closeModal('settingsModal')">✕</button></div>
    <div class="modal-body">
      <div class="setting-row">
        <div><div class="label">Theme</div><div class="desc">Applies across Word, Sheet and PowerPoint.</div></div>
        <div class="theme-choices">
          <button data-theme-choice="light">Light</button>
          <button data-theme-choice="dark">Dark</button>
          <button data-theme-choice="system">System</button>
        </div>
      </div>
      <div class="setting-row">
        <div><div class="label">Storage</div><div class="desc">Workbooks are saved in this browser only.</div></div>
      </div>
    </div>
  </div>
</div>

<script src="xlsx.full.min.js"></script>
<script src="db.js"></script>
<script src="undo.js"></script>
<script src="common.js"></script>
<script src="sheet.js"></script>
</body>
</html>
